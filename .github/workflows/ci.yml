name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # --------------------------------------------------
  # SAST Code Scan (Trivy)
  # --------------------------------------------------
  sast-scan:
    name: SAST Code Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (FS / SAST)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,config'
          format: 'sarif'
          output: 'trivy-sast-results.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Render Trivy SAST Report to Summary
        uses: b-zurg/sarif-to-markdown@v1
        if: always()
        with:
          file-path: 'trivy-sast-results.sarif'
          add-job-summary: true

      - name: Archive Trivy SAST SARIF artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sast-report
          path: trivy-sast-results.sarif

  # --------------------------------------------------
  # Backend API CI (Python / FastAPI)
  # --------------------------------------------------
  api-ci:
    name: Backend API CI & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'api/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt

      - name: Run Pytest suite
        run: |
          cd api
          pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for API
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/api
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Single Build: builds native amd64 and loads directly into daemon
      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # Scan the local image tag that was just loaded
      - name: Run Trivy container scanner (API)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/api:latest
          format: 'sarif'
          output: 'trivy-api-results.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Render Trivy API SARIF report to Summary
        uses: b-zurg/sarif-to-markdown@v1
        if: always()
        with:
          file-path: 'trivy-api-results.sarif'
          add-job-summary: true

      - name: Archive Trivy API SARIF artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-api-report
          path: trivy-api-results.sarif

      # Push directly to GHCR using docker CLI without rebuilding
      - name: Push API Docker Image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push --all-tags ${{ env.REGISTRY }}/${{ github.repository }}/api

  # --------------------------------------------------
  # Frontend CI (Next.js / Node.js)
  # --------------------------------------------------
  frontend-ci:
    name: Frontend Next.js CI & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'front-end-nextjs/package-lock.json'

      - name: Install dependencies & run linter
        run: |
          cd front-end-nextjs
          npm ci
          npm run lint

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for Frontend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Single Build: builds native amd64 and loads directly into daemon
      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./front-end-nextjs
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Scan the local image tag that was just loaded
      - name: Run Trivy container scanner (Frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/frontend:latest
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Render Trivy Frontend SARIF report to Summary
        uses: b-zurg/sarif-to-markdown@v1
        if: always()
        with:
          file-path: 'trivy-frontend-results.sarif'
          add-job-summary: true

      - name: Archive Trivy Frontend SARIF artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-frontend-report
          path: trivy-frontend-results.sarif

      # Push directly to GHCR using docker CLI without rebuilding
      - name: Push Frontend Docker Image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push --all-tags ${{ env.REGISTRY }}/${{ github.repository }}/frontend
