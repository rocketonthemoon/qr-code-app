name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  # --------------------------------------------------
  # SAST Code Scan (Trivy)
  # --------------------------------------------------
  sast-scan:
    name: SAST Code Scan (Trivy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (FS / SAST)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,config'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # --------------------------------------------------
  # Backend API CI (Python / FastAPI)
  # --------------------------------------------------
  api-ci:
    name: Backend API CI & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'api/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt

      - name: Run Pytest suite
        run: |
          cd api
          pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GIT_HUB_TOKEN }}

      - name: Extract Docker metadata for API
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/api
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=sha,format=short

      - name: Build and Push API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          load: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            api:latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: Docker Scout Image Scan (API)
        uses: docker/scout-action@v1
        with:
          command: cve
          image: api:latest
          only-severities: critical,high
          exit-code: true

  # --------------------------------------------------
  # Frontend CI (Next.js / Node.js)
  # --------------------------------------------------
  frontend-ci:
    name: Frontend Next.js CI & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'front-end-nextjs/package-lock.json'

      - name: Install dependencies
        run: |
          cd front-end-nextjs
          npm ci

      - name: Build Next.js app
        run: |
          cd front-end-nextjs
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GIT_HUB_TOKEN }}

      - name: Extract Docker metadata for Frontend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/frontend
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=sha,format=short

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./front-end-nextjs
          load: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            frontend:latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: Docker Scout Image Scan (Frontend)
        uses: docker/scout-action@v1
        with:
          command: cve
          image: frontend:latest
          only-severities: critical,high
          exit-code: true

